name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://tasks.molotilka.site
    steps:
      - name: Deploy exact commit over SSH
        env:
          DEPLOY_KEY: ${{ secrets.HOSTINGER_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "taskdeploy@$DEPLOY_HOST" "deploy $DEPLOY_SHA"
      - name: Verify public application
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://tasks.molotilka.site/health
      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
